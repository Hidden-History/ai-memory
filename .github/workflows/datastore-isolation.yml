name: Datastore Isolation

# TD-881 / TD-876. Proves the test suite cannot reach the operator's production
# Qdrant, embedding service, or Langfuse instance.
#
# The oracle is a tripwire accept-counter, never pytest's exit code: a failed
# connection is wrapped into ResponseHandlingException and swallowed by this
# repository's broad graceful-degradation handlers, so a run that touched
# production repeatedly still exits 0.
#
# The self-test step is load-bearing. A counter reading zero because it is
# broken looks exactly like a counter reading zero because nothing connected --
# that is how an earlier guard design passed its own self-test while leaving the
# production gRPC path open.

on:
  pull_request:
    paths:
      - "tests/**"
      - "src/**"
      - "scripts/**"
      - "pyproject.toml"
      - ".github/workflows/datastore-isolation.yml"
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: datastore-isolation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tripwire:
    name: Tests cannot reach the production datastore
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Select a network-namespace wrapper
        id: netns
        run: |
          # Unprivileged user namespaces are the preferred route because the
          # suite then runs as the normal user. Some Ubuntu images ship
          # kernel.apparmor_restrict_unprivileged_userns=1, which blocks that;
          # the runner has passwordless sudo, so fall back rather than fail.
          if unshare -rn true 2>/dev/null; then
            echo "mode=unprivileged" >> "$GITHUB_OUTPUT"
          elif sudo unshare -n true 2>/dev/null; then
            echo "mode=sudo" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No usable network namespace on this runner."
            echo "Both 'unshare -rn' and 'sudo unshare -n' failed, so the suite"
            echo "cannot be isolated and this gate cannot vouch for anything."
            exit 1
          fi
          echo "apparmor_restrict_unprivileged_userns=$(
            sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null \
            || echo '<absent>')"

      - name: Prove the tripwire counter works
        run: |
          set -euo pipefail
          if [ "${{ steps.netns.outputs.mode }}" = "sudo" ]; then
            sudo unshare -n sh -c 'ip link set lo up && exec "$@"' _ \
              python3 tests/datastore_tripwire.py --self-test
          else
            unshare -rn sh -c 'ip link set lo up && exec "$@"' _ \
              python3 tests/datastore_tripwire.py --self-test
          fi

      - name: Run the CI-scope suite behind the tripwire
        run: |
          set -uo pipefail
          # Clear every variable that could aim the suite at a real service, so
          # this measures the default an unsuspecting caller would get. The
          # namespace does not clear environment variables -- both halves are
          # needed.
          # -p no:randomly: pytest-randomly reorders every run, and the accept
          # count depends on which tests run and in what order. A ratchet needs
          # a comparable number run to run, so ordering is fixed here. The
          # general test workflow keeps randomisation; this job trades it for a
          # measurement that means the same thing each time.
          RUN='python3 tests/datastore_tripwire.py --report tripwire-report.json --
               python3 -m pytest tests/ -m "not regression and not quarantine"
               -q -p no:cacheprovider -p no:randomly --tb=no'
          if [ "${{ steps.netns.outputs.mode }}" = "sudo" ]; then
            sudo -E env -u QDRANT_URL -u QDRANT_PORT -u QDRANT_GRPC_PORT \
              -u EMBEDDING_PORT -u EMBEDDING_SERVICE_PORT -u LANGFUSE_BASE_URL \
              unshare -n sh -c 'ip link set lo up && exec "$@"' _ sh -c "$RUN"
          else
            env -u QDRANT_URL -u QDRANT_PORT -u QDRANT_GRPC_PORT \
              -u EMBEDDING_PORT -u EMBEDDING_SERVICE_PORT -u LANGFUSE_BASE_URL \
              unshare -rn sh -c 'ip link set lo up && exec "$@"' _ sh -c "$RUN"
          fi

      - name: Ratchet - connections to production must not increase
        run: |
          python3 tests/datastore_tripwire.py \
            --check tripwire-report.json \
            --baseline tests/datastore_isolation_baseline.json

      - name: Upload the accept report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tripwire-report
          path: tripwire-report.json
          if-no-files-found: warn
