name: "AI-Memory CodeQL config"

# Adds custom configuration on top of the workflow's `queries: +security-extended`
# directive. Used by .github/workflows/codeql.yml via the `config-file` parameter
# on github/codeql-action/init@v4.

queries:
  - uses: security-extended

# Exclude scripts/verify_env_split.py from CodeQL analysis entirely.
#
# Rationale (BUG-277, PM #272/#273): verify_env_split.py is a standalone env-split
# doctor command invoked manually by operators. It reads docker/.env and
# docker/.env.secrets to assert ENV-MANAGEMENT-V2 split-file invariants, then prints
# diagnostic output embedding key NAMES only (set membership against constant
# PP_*_KEYS / LANGFUSE_NON_SECRET_INIT_KEYS / ALL_SECRET_KEYS lists). Secret VALUES
# are never logged. Key-name lists are routed through tuple(sorted(...)) constructors
# as a defensive taint-break, but CodeQL's static analyser conservatively traces
# .get(k) truth-tests as value reads and fires `py/clear-text-logging-sensitive-data`
# regardless. Inline `# lgtm[query-id]` markers are not honoured by
# github/codeql-action@v4 (legacy LGTM.com platform deprecated; no inline-comment
# replacement). Per-query per-path filters via `query-filters: exclude` are also not
# supported — CodeQL action v4 logs `informsAboutUnsupportedPathFilters` and ignores
# the path constraint silently.
#
# `paths-ignore` is the supported v4 mechanism for file-scoped exclusion. Acceptable
# coverage tradeoff: the file is read-only file inspection + print with no SQL,
# network, auth, template, or deserialisation surface; full CodeQL coverage on this
# one file has no real security value relative to the alert noise it generates.
# All other files keep `py/clear-text-logging-sensitive-data` coverage (incl. the
# migrate scripts at scripts/migrate_v209_github_collection.py +
# scripts/migrate_v221_hybrid_vectors.py whose dormant PR-only alerts are unchanged).
#
# See:
#   - oversight/bugs/BUG-277-env-secrets-split-partial.md
#   - oversight/tasks/pm272-wave6-bug277-fix-r4/recommendation-first.md §B
#
# Exclude the TD-744 SOT permission regression test from CodeQL analysis.
#
# Rationale (TD-744, PR #236): test_td744_bootstrap.py is a security regression
# test for the staging-file permission fix. To prove the fix resets an
# overwritten staging file back to owner-only (0o600), the test must first
# deliberately create a non-owner-only staging file via os.chmod (a world-
# readable 0o644 stale-file repro). CodeQL's `py/overly-permissive-file-
# permissions` flags that os.chmod regardless of intent — it cannot distinguish
# regression-test setup from a real vulnerability. Inline `# codeql` / `# lgtm`
# markers are not honoured by github/codeql-action@v4 (legacy LGTM.com platform
# deprecated; no inline-comment replacement), and per-query path constraints via
# `query-filters` are also unsupported — CodeQL action v4 logs
# `informsAboutUnsupportedPathFilters` and ignores them silently. `paths-ignore`
# is the supported v4 mechanism for file-scoped exclusion. Acceptable coverage
# tradeoff: test code is not shipped or executed in production, so excluding it
# from the permission query has no real security value relative to the
# unavoidable false-positive it generates.
#
# See:
#   - TD-744 (SOT auto-bootstrap staging-file permission fix)
#   - PR #236
paths-ignore:
  - scripts/verify_env_split.py
  - _ai-memory/skills/aim-sot/tests/test_td744_bootstrap.py
