name: ai-memory

# Consistent labels for filtering and for wipe/prune guardrails in other tooling.
# Filter examples:
#   docker ps --filter label=ai-memory.managed=true
#   docker volume ls --filter label=ai-memory.managed=true
x-ai-memory-labels: &ai-memory-labels
  ai-memory.managed: "true"
  ai-memory.wipe-policy: "exclude"
  ai-memory.stack: "core"
  org.opencontainers.image.vendor: "ai-memory"

# BP-152 §3.1/3.4/3.5: DRY env injection for Python services via env_file: directive.
# Applied to: monitoring-api, streamlit, classifier-worker, github-sync.
# Not applied to: qdrant (uses QDRANT__SERVICE__* config key naming — see qdrant service comment),
#   embedding (image-specific model vars, no MemoryConfig overlap),
#   prometheus-init (one-shot, two-key explicit block is cleaner),
#   prometheus/pushgateway/grafana (non-Python or Langfuse stack with own config).
x-python-service-defaults: &python-service-defaults
  env_file:
    - path: .env
      required: true          # fail-fast if .env missing — Compose 2.24.0+ required
    - path: .env.secrets
      required: false         # optional sensitive split (chmod 600); absent in dev is OK
    - path: ${PROJECT_ENV_FILE:-/dev/null}
      required: false         # per-project override from projects.d/<name>/.env
  restart: unless-stopped

services:
  qdrant:
    image: qdrant/qdrant:v1.16.3
    container_name: ${AI_MEMORY_CONTAINER_PREFIX:-ai-memory}-qdrant
    labels:
      <<: *ai-memory-labels
      ai-memory.service: "qdrant"
    ports:
      - "127.0.0.1:${QDRANT_PORT:-26350}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT:-26351}:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    # Qdrant uses its own config key naming (QDRANT__SERVICE__*) — the env_file: pattern
    # is not applicable here because Qdrant reads QDRANT__SERVICE__API_KEY, not QDRANT_API_KEY.
    # QDRANT_API_KEY and QDRANT_READ_ONLY_API_KEY interpolation are both known BUG-184-class
    # limitations; both require the unset-ritual workaround until Qdrant's config schema
    # permits a direct remap.
    environment:
      - QDRANT__LOG_LEVEL=${QDRANT_LOG_LEVEL:-INFO}
      # API Key Authentication (BP-040) - Requires TLS for production
      # For localhost-only development, API key provides basic access control
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY}
      # BUG-287: Wire read-only API key to Qdrant container so TD-333
      # `get_qdrant_client(read_only=True)` callers work end-to-end.
      - QDRANT__SERVICE__READ_ONLY_API_KEY=${QDRANT_READ_ONLY_API_KEY}
    restart: unless-stopped
    # TD-341: HTTP readiness check via /readyz (BP-145). Auth-whitelisted since Qdrant v1.5.0.
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e \"GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q \"HTTP/1.1 200\" <&3'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  embedding:
    build:
      context: ..
      dockerfile: docker/embedding/Dockerfile
    container_name: ${AI_MEMORY_CONTAINER_PREFIX:-ai-memory}-embedding
    labels:
      <<: *ai-memory-labels
      ai-memory.service: "embedding"
    ports:
      - "127.0.0.1:${EMBEDDING_PORT:-28080}:8080"
    volumes:
      # fastembed stores models in ~/.cache/fastembed, mount entire cache dir
      - embedding_cache:/home/embedding/.cache
    # Embedding service uses image-specific model vars (MODEL_NAME_EN, FASTEMBED_CACHE_PATH)
    # with minimal overlap with MemoryConfig; explicit block is cleaner than the anchor here.
    environment:
      # SPEC-010: Dual embedding model configuration
      - MODEL_NAME_EN=${MODEL_NAME_EN:-jinaai/jina-embeddings-v2-base-en}
      - MODEL_NAME_CODE=${MODEL_NAME_CODE:-jinaai/jina-embeddings-v2-base-code}
      - VECTOR_DIMENSIONS=768
      - LOG_LEVEL=${AI_MEMORY_LOG_LEVEL:-INFO}
      # PLAN-013: ColBERT late interaction model (opt-in, ~400MB download)
      - COLBERT_ENABLED=${COLBERT_ENABLED:-false}
      # Set fastembed cache to persistent volume location
      - FASTEMBED_CACHE_PATH=/home/embedding/.cache/fastembed
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 15
      start_period: 300s  # BUG-040: Increased for first-time model download (~500MB per model). Total wait: 300s + 30s*15 = 750s (12.5 min)
    deploy:
      resources:
        limits:
          # SPEC-010: Increased from 2G to 4G for dual model support (two ONNX models ~3GB)
          memory: ${EMBEDDING_MEMORY_LIMIT:-4G}

  monitoring-api:
    build:
      context: ..
      dockerfile: monitoring/Dockerfile
    container_name: ${AI_MEMORY_CONTAINER_PREFIX:-ai-memory}-monitoring-api
    labels:
      <<: *ai-memory-labels
      ai-memory.service: "monitoring-api"
    profiles: ["testing", "monitoring"]
    ports:
      - "127.0.0.1:28000:8000"
    <<: *python-service-defaults
    environment:
      # Service-specific overrides — all other config comes from env_file: (BP-152 §3.2/3.3)
      - QDRANT_HOST=qdrant       # container-internal hostname (not localhost)
      - QDRANT_PORT=6333         # container-internal port (not host port QDRANT_PORT)
      - VECTOR_DIMENSIONS=768    # hardcoded — not user-tunable via .env
    depends_on:
      qdrant:
        condition: service_healthy
    # Security hardening (2026 best practices)
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; exit(0 if httpx.get('http://localhost:8000/health', timeout=5).status_code == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # BLK-021: Init container generates Prometheus config with fresh bcrypt hash
  # prom/prometheus is BusyBox-based (no package manager, no Python)
  # Best practice: Docker init container pattern for config generation
  prometheus-init:
    image: python:3.12-alpine
    container_name: ${AI_MEMORY_CONTAINER_PREFIX:-ai-memory}-prometheus-init
    labels:
      <<: *ai-memory-labels
      ai-memory.service: "prometheus-init"
    profiles: ["monitoring"]
    volumes:
      - prometheus_runtime:/etc/prometheus/runtime
      - ./prometheus/web.yml:/etc/prometheus/web.yml.template:ro
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml.template:ro
      - ./prometheus/gen-prometheus-config.py:/scripts/gen-prometheus-config.py:ro
    # One-shot init container: only needs 2 keys; explicit block is cleaner than the full anchor.
    environment:
      - PROMETHEUS_ADMIN_PASSWORD=${PROMETHEUS_ADMIN_PASSWORD}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
    command: ["sh", "-c", "pip install --no-cache-dir bcrypt==4.2.1 && python3 /scripts/gen-prometheus-config.py"]
    restart: "no"
    # Security hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - default

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: ${AI_MEMORY_CONTAINER_PREFIX:-ai-memory}-prometheus
    labels:
      <<: *ai-memory-labels
      ai-memory.service: "prometheus"
    profiles: ["monitoring"]
    ports:
      - "127.0.0.1:29090:9090"
    volumes:
      - prometheus_runtime:/etc/prometheus/runtime:ro
      - prometheus_data:/prometheus
    environment:
      - PROMETHEUS_BASIC_AUTH_HEADER=${PROMETHEUS_BASIC_AUTH_HEADER}
    command:
      - "--config.file=/etc/prometheus/runtime/prometheus.yml"
      - "--web.config.file=/etc/prometheus/runtime/web.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    restart: unless-stopped
    # Security hardening (2026 best practices)
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      prometheus-init:
        condition: service_completed_successfully
    networks:
      - default
    # BP-040: Healthcheck with basic auth via Authorization header
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$PROMETHEUS_BASIC_AUTH_HEADER\" ]; then wget --quiet --tries=1 --spider --header=\"Authorization: $PROMETHEUS_BASIC_AUTH_HEADER\" http://localhost:9090/-/healthy; else wget --quiet --tries=1 --spider http://localhost:9090/-/healthy; fi"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  pushgateway:
    image: prom/pushgateway:v1.9.0
    container_name: ${AI_MEMORY_CONTAINER_PREFIX:-ai-memory}-pushgateway
    labels:
      <<: *ai-memory-labels
      ai-memory.service: "pushgateway"
    profiles: ["monitoring"]
    # Enable persistence to retain metrics across restarts (BP-028)
    # BUG-080: Mount volume at /pushgateway (owned by nobody:nobody in image)
    # instead of /data (created as root:root by Docker, unwritable by UID 65534)
    command:
      - "--persistence.file=/pushgateway/pushgateway.pf"
      - "--persistence.interval=5m"
    ports:
      - "127.0.0.1:29091:9091"
    restart: unless-stopped
    volumes:
      - pushgateway_data:/pushgateway
    user: "65534:65534"
    # Security hardening (2026 best practices)
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - default
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9091/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  grafana:
    image: grafana/grafana:12.0.0
    container_name: ${AI_MEMORY_CONTAINER_PREFIX:-ai-memory}-grafana
    labels:
      <<: *ai-memory-labels
      ai-memory.service: "grafana"
    profiles: ["monitoring"]
    ports:
      - "127.0.0.1:23000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    # Grafana uses its own GF_* config key namespace and does not share MemoryConfig schema.
    # The explicit environment: block is correct here — env_file: anchor is for Python services.
    environment:
      # Admin Credentials (BP-040) - Only applies on FIRST LAUNCH
      # To change existing password: docker exec -it ai-memory-grafana grafana-cli admin reset-admin-password <new_password>
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      # TD-370: no default — installer generates a random password; see scripts/install.sh
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      # Prometheus datasource auth (BP-040) - used by provisioning file env substitution
      - PROMETHEUS_ADMIN_PASSWORD=${PROMETHEUS_ADMIN_PASSWORD}
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_SERVER_ROOT_URL=http://localhost:23000
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      # Session configuration (prevent frequent re-login)
      - GF_AUTH_LOGIN_COOKIE_NAME=grafana_session
      - GF_AUTH_LOGIN_MAXIMUM_INACTIVE_LIFETIME_DURATION=7d
      - GF_AUTH_LOGIN_MAXIMUM_LIFETIME_DURATION=30d
      # Cookie settings for session persistence
      - GF_SECURITY_COOKIE_SAMESITE=lax
      - GF_SECURITY_COOKIE_SECURE=false
      # Security hardening (2026 best practices)
      - GF_SECURITY_SECRET_KEY=${GRAFANA_SECRET_KEY}
      - GF_SECURITY_CSRF_ALWAYS_CHECK=true
      - GF_SNAPSHOTS_EXTERNAL_ENABLED=false
    # Security hardening (2026 best practices)
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      prometheus:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # NOTE: grafana-datasource-init removed - credentials now injected via
  # environment variable substitution in provisioning file (BP-040, Grafana 10+)

  streamlit:
    build:
      context: ./streamlit
      dockerfile: Dockerfile
    container_name: ${AI_MEMORY_CONTAINER_PREFIX:-ai-memory}-streamlit
    labels:
      <<: *ai-memory-labels
      ai-memory.service: "streamlit"
    profiles: ["monitoring"]
    # Authentication: Deferred to Phase 2 (TECH-DEBT-076)
    # Requires streamlit-authenticator library or OIDC (BP-040 Section 4)
    ports:
      - "127.0.0.1:28501:8501"
    volumes:
      # Use AI_MEMORY_INSTALL_DIR for project-specific logs (multi-project support)
      # logs: read-write (hooks need write access for activity logging)
      # queue: read-only (Streamlit only reads pending operations)
      # QUEUE-UNIFY: All queues now use unified pending_queue.jsonl in /app/queue
      - ${AI_MEMORY_INSTALL_DIR:-${HOME}/.ai-memory}/logs:/app/logs
      - ${AI_MEMORY_INSTALL_DIR:-${HOME}/.ai-memory}/queue:/app/queue:ro
      # Mount src/ for memory.models import (DRY - single source of truth for types)
      - ../src:/app/src:ro
    <<: *python-service-defaults
    restart: on-failure:3  # F-M1 fix: explicit restart override prevents anchor inheritance regression to unless-stopped
    environment:
      # Service-specific overrides — all other config comes from env_file: (BP-152 §3.2/3.3)
      - QDRANT_HOST=qdrant                             # container-internal hostname
      - QDRANT_PORT=6333                               # container-internal port
      - QDRANT_EXTERNAL_PORT=26350                     # hardcoded external reference for UI links
      - EMBEDDING_SERVICE_URL=http://embedding:8080    # container-internal URL
      - AI_MEMORY_INSTALL_DIR=/app                     # container path override
    depends_on:
      qdrant:
        condition: service_healthy
      embedding:
        condition: service_healthy
    # Security hardening (2026 best practices)
    # Note: read_only disabled to allow Streamlit machine ID creation
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=50m
    networks:
      - default
    # Resource limits to prevent memory exhaustion
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
    # Log rotation configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  classifier-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    container_name: ${AI_MEMORY_CONTAINER_PREFIX:-ai-memory}-classifier-worker
    labels:
      <<: *ai-memory-labels
      ai-memory.service: "classifier-worker"
    <<: *python-service-defaults
    environment:
      # Service-specific overrides — all other config comes from env_file: (BP-152 §3.2/3.3)
      - QDRANT_HOST=qdrant                            # container-internal hostname
      - QDRANT_PORT=6333                              # container-internal port
      - PUSHGATEWAY_URL=pushgateway:9091              # container-internal URL
      - LANGFUSE_BASE_URL=http://langfuse-web:3000    # container-internal URL
      # BUG-150: LANGFUSE_TRACING_ENABLED mirrors LANGFUSE_ENABLED — Docker-only alias,
      # not a MemoryConfig field; must remain explicit until both share the same key.
      - LANGFUSE_TRACING_ENABLED=${LANGFUSE_ENABLED:-false}
      - AI_MEMORY_INSTALL_DIR=/app                    # container path override
      - AI_MEMORY_QUEUE_DIR=/app/queue                # container path override
      - MEMORY_CLASSIFIER_TIMEOUT=120                 # BUG-290: explicit override — cold-start defense-in-depth
    volumes:
      - ../src:/app/src:ro
      - ../scripts:/app/scripts:ro
      - ${AI_MEMORY_QUEUE_DIR:-~/.ai-memory/queue}:/app/queue
      # Shared trace buffer for 9_classify span emission (BUG-150)
      - ${AI_MEMORY_INSTALL_DIR:-~/.ai-memory}/trace_buffer:/app/trace_buffer
    depends_on:
      qdrant:
        condition: service_healthy
    # Run as host user for queue file access (bind mount permissions)
    user: "${UID:-1000}:${GID:-1000}"
    stop_grace_period: 30s
    # Security hardening (2026 best practices)
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=50m
    networks:
      - default  # Internal network - classifier communicates with qdrant/pushgateway only
    # Resource limits to prevent exhaustion
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256M
    # Log rotation configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python3", "-c", "from pathlib import Path; exit(0 if Path('/tmp/worker.health').exists() else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s  # F2/F9: Allow time for Python startup, logger init, and first health file creation (typically <5s, buffer for slow systems)

  github-sync:
    build:
      context: ..
      dockerfile: docker/github-sync/Dockerfile
    container_name: ${AI_MEMORY_CONTAINER_PREFIX:-ai-memory}-github-sync
    labels:
      <<: *ai-memory-labels
      ai-memory.service: "github-sync"
    profiles: ["github"]
    <<: *python-service-defaults
    environment:
      # Service-specific overrides — all other config comes from env_file: (BP-152 §3.2/3.3)
      - QDRANT_HOST=qdrant                            # container-internal hostname
      - QDRANT_PORT=6333                              # container-internal port
      - EMBEDDING_HOST=embedding                      # container-internal hostname
      - EMBEDDING_PORT=8080                           # container-internal port
      - PUSHGATEWAY_URL=pushgateway:9091              # container-internal URL
      - LANGFUSE_BASE_URL=http://langfuse-web:3000    # container-internal URL
      # BUG-150: LANGFUSE_TRACING_ENABLED mirrors LANGFUSE_ENABLED — Docker-only alias.
      - LANGFUSE_TRACING_ENABLED=${LANGFUSE_ENABLED:-false}
      # LOG_LEVEL alias: github-sync reads LOG_LEVEL; AI_MEMORY_LOG_LEVEL is the primary key.
      # Both are accepted by MemoryConfig (validation_alias), but LOG_LEVEL is explicit here
      # to ensure the service receives it regardless of which alias the user sets.
      - LOG_LEVEL=${AI_MEMORY_LOG_LEVEL:-INFO}
      # PLAN-009: Tell discover_projects() where the mounted projects.d lives.
      # Path.home() inside the container is not /config, so we must be explicit.
      - AI_MEMORY_PROJECTS_DIR=/config/projects.d
      # Explicit install_dir so config.install_dir resolves to a writable path.
      # Required because container HOME=/ makes ~/.ai-memory expand to /.ai-memory
      # (read-only root fs). Matches other services (hook-capture, classifier-worker).
      - AI_MEMORY_INSTALL_DIR=/app
    volumes:
      # Persist sync state across container restarts.
      # Engine (post-PR #111) writes to config.install_dir/github-state/ = /app/github-state/
      # Legacy path /app/.audit/state/ is still checked by github_state_candidates() for
      # auto-migration of pre-#111 state files.
      - ${AI_MEMORY_INSTALL_DIR:-${HOME}/.ai-memory}/github-state:/app/github-state
      # Freshness scanner log directory (read_only: true blocks writes otherwise)
      - ${AI_MEMORY_INSTALL_DIR:-${HOME}/.ai-memory}/github-state/logs:/app/.audit/logs
      # Multi-project config directory (PLAN-009)
      - ${AI_MEMORY_INSTALL_DIR:-${HOME}/.ai-memory}/config/projects.d:/config/projects.d:ro
      # Shared trace buffer for Langfuse span emission. github-sync writes
      # storage-layer traces here; without this mount writes fail with
      # read-only filesystem (container image fs at /app is not writable).
      # Matches classifier-worker pattern (L387). Caught during Phase B
      # live verification after the install_dir fix unmasked the issue.
      - ${AI_MEMORY_INSTALL_DIR:-${HOME}/.ai-memory}/trace_buffer:/app/trace_buffer
    depends_on:
      qdrant:
        condition: service_healthy
      embedding:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    # Run as host user for bind mount permissions (matches classifier-worker pattern)
    user: "${UID:-1000}:${GID:-1000}"
    # Security hardening (2026 best practices)
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=50m
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M  # SPEC-009: Increased for security scanning (detect-secrets + SpaCy)
    # Log rotation
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python3", "-c", "from pathlib import Path; import time; p = Path('/tmp/sync.health'); exit(0 if p.exists() and (time.time() - p.stat().st_mtime) < 3600 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

networks:
  default:
    labels:
      <<: *ai-memory-labels
      ai-memory.network: "default"

volumes:
  qdrant_storage:
    driver: local
    labels:
      <<: *ai-memory-labels
      ai-memory.volume: "qdrant_storage"
  prometheus_data:
    driver: local
    labels:
      <<: *ai-memory-labels
      ai-memory.volume: "prometheus_data"
  prometheus_runtime:
    driver: local
    labels:
      <<: *ai-memory-labels
      ai-memory.volume: "prometheus_runtime"
  grafana_data:
    driver: local
    labels:
      <<: *ai-memory-labels
      ai-memory.volume: "grafana_data"
  embedding_cache:
    driver: local
    labels:
      <<: *ai-memory-labels
      ai-memory.volume: "embedding_cache"
  pushgateway_data:
    driver: local
    labels:
      <<: *ai-memory-labels
      ai-memory.volume: "pushgateway_data"
