- template: templates/oversight/plans/MASTER_PLAN_TEMPLATE.md
  produces: family
  glob: oversight/plans/*.md
  glob_exclude:
  - MASTER_PLAN_TEMPLATE.md
  - PLAN_TEMPLATE.md
  - SESSION_STEP_PLAN_TEMPLATE.md
  - INDEX.md
  match_frontmatter:
    plan_role: master
  class: detail-record
  required_skeleton:
    derive_from: templates/oversight/plans/MASTER_PLAN_TEMPLATE.md
    required_frontmatter_keys:
    - plan_id
    - plan_role
    - type
    - status
    required_sections:
    - '## Ordering rule*'
    - '## Status semantics*'
    - '## SSoT discipline'
    - '## Master spine*'
    - '## Row-maintenance rules'
    - '## Continuity Log'
    ordered: false
    match_case: false
  conventions:
    plan_role_value: master
    plan_id_pattern: ^PLAN-MASTER-
    status_values:
    - draft
    - active
    - done
    - superseded
    type_values:
    - build
    - ops
    retention_trigger: never
- template: templates/oversight/plans/PLAN_TEMPLATE.md
  produces: family
  glob: oversight/plans/*.md
  glob_exclude:
  - MASTER_PLAN_TEMPLATE.md
  - PLAN_TEMPLATE.md
  - SESSION_STEP_PLAN_TEMPLATE.md
  - INDEX.md
  match_frontmatter:
    plan_role: standalone
  class: detail-record
  required_skeleton:
    derive_from: templates/oversight/plans/PLAN_TEMPLATE.md
    required_frontmatter_keys:
    - plan_id
    - type
    - status
    required_sections:
    - '## 1. Goal'
    - '## 2. Done-Condition'
    - '## 3. Work Items'
    - '## 4. Out of Scope / Non-Goals'
    - '## 5. Verification'
    - '## 6. Open Questions'
    - '## 7. Continuity Log'
    ordered: false
    match_case: false
  conventions:
    plan_id_pattern: ^PLAN-
    status_values:
    - draft
    - approved
    - active
    - done
    - superseded
    - abandoned
    type_values:
    - build
    - ops
    - maintenance
    - verification
    - research
    work_item_status_values:
    - todo
    - doing
    - done
    - blocked
    at_most_one_doing: true
    conditional_required_frontmatter:
      when:
        plan_role: session
      require:
      - master_plan
      - step_id
    retention_trigger: never
