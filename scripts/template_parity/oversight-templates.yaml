# oversight-templates.yaml
schema_version: 1
description: Template-parity registry (PLAN-035 P2). Declares what AI-Memory SHIPS, derived from git-tracked
  templates/oversight/. Report-only per user project; CI-blocking in source.
templates:
- template: templates/oversight/project-status.md
  produces: singleton
  target: oversight/project-status.md
  class: heartbeat
  required_skeleton:
    required_frontmatter_keys:
    - class
    - cap_lines
    - cap_kb
    required_yaml_body_keys:
    - current_phase
    - active_task
    - phases_complete
    - key_files
    - live_record
    - open_issues
  conventions:
    cap_lines: 60
    cap_kb: 6
  consumed_by:
  - aim-tracking-rotate
- template: templates/oversight/SESSION_WORK_INDEX.md
  produces: singleton
  target: oversight/SESSION_WORK_INDEX.md
  class: live-index
  required_skeleton:
    required_sections:
    - '## Current Sprint'
    - '## Active Task'
    - '## Active Blockers'
    - '## High Priority Risks'
    required_frontmatter_keys:
    - class
    - cap_lines
    - cap_kb
    required_fields:
    - Sprint
    - Goal
    - Status
  conventions:
    entry_pattern: '^\| '
    cap_lines: 80
    cap_kb: 12
  consumed_by:
  - aim-tracking-rotate
- template: templates/oversight/tracking/task-tracker.md
  produces: singleton
  target: oversight/tracking/task-tracker.md
  class: register
  required_skeleton:
    required_sections:
    - '## Current Sprint'
    - '## Naming Convention'
    required_frontmatter_keys:
    - class
    - cap_lines
    - cap_kb
  conventions:
    cap_lines: 60
    cap_kb: 4.5
    last_updated_present: true
  consumed_by:
  - aim-tracking-rotate
- template: templates/oversight/tracking/blockers-log.md
  produces: singleton
  target: oversight/tracking/blockers-log.md
  class: register
  required_skeleton:
    required_sections:
    - '## Active Blockers'
    - '## Blocker Details'
    - '## Resolved Blockers'
    required_frontmatter_keys:
    - class
    - cap_lines
    - cap_kb
  conventions:
    cap_lines: 100
    cap_kb: 15
    last_updated_present: true
  consumed_by:
  - aim-tracking-rotate
- template: templates/oversight/tracking/risk-register.md
  produces: singleton
  target: oversight/tracking/risk-register.md
  class: register
  required_skeleton:
    required_sections:
    - '## Active Risks'
    - '## Resolved Risks'
    required_frontmatter_keys:
    - class
    - cap_lines
    - cap_kb
  conventions:
    cap_lines: 120
    cap_kb: 12
    last_updated_present: true
  consumed_by:
  - aim-tracking-rotate
- template: templates/oversight/tracking/decision-log.md
  produces: singleton
  target: oversight/tracking/decision-log.md
  class: append-only-log
  required_skeleton:
    required_sections:
    - '## Decisions'
    required_frontmatter_keys:
    - class
    - cap_lines
    - cap_kb
  conventions:
    entry_pattern: ^### DEC-[A-Z0-9-]+-D\d
    order: newest_first
    cap_lines: 150
    cap_kb: 50
  consumed_by:
  - aim-tracking-rotate
  - aim-tracking-freshness
- template: templates/oversight/tracking/technical-debt.md
  produces: singleton
  target: oversight/tracking/technical-debt.md
  class: register
  required_skeleton:
