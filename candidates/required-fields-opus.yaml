  - family: ROOT_CAUSE
    template: templates/oversight/bugs/ROOT_CAUSE_TEMPLATE.md
    frozen_glob: oversight/bugs/ROOT_CAUSE-*.md
    verdict: ZERO INSTANCES (pattern has no adoption anywhere)
    recommend: KEEP glob_unverified
    evidence: []
    proposed_glob: oversight/bugs/*root-cause*.md   # optional — see caveat
    notes: >-
      `ROOT_CAUSE-*.md` matched 0 files in ALL four corpus projects. Real root-cause analyses are
      authored INSIDE the BUG-* namespace: primary has `BUG-004-root-cause-analysis.md`,
      `BUG-143-trace-buffer-owned-by-root.md`, `BUG-281-docker-mount-creates-root-owned-host-dir.md`.
      A proposed `*root-cause*.md` glob would OVERLAP the BUG family glob (`oversight/bugs/BUG-*.md`),
      creating double-classification. Because the template's own `ROOT_CAUSE-` naming has zero adoption
      and a corrected glob raises a namespace-overlap design question (is RCA a distinct family or a BUG
      sub-form?), KEEP the flag and escalate the design decision rather than auto-proposing.

  - family: SPEC
    template: templates/oversight/specs/SPEC_TEMPLATE.md
    frozen_glob: oversight/specs/SPEC-*.md
    verdict: THIN/AMBIGUOUS (pattern matches a tiny minority; precision risk)
    recommend: KEEP glob_unverified
    evidence:
      - /mnt/e/projects/dev-ai-memory/oversight/specs/SPEC-CORRECTIONS-V207.md
      - /mnt/e/projects/ai-memory-testV2/oversight/specs/SPEC-CORRECTIONS-V207.md   # test-install copy of the same file
    notes: >-
      `SPEC-*.md` matches ~1 distinct real file (`SPEC-CORRECTIONS-V207.md`, appearing in primary and its
      testV2 install-copy). Meanwhile the specs/ directory is DOMINATED (~40 files in primary) by freeform
      names — `Chunking-Strategy-V2.md`, `LANGFUSE-INTEGRATION-SPEC.md`, `Core-Architecture-Principle-V2.md`,
      `DISPATCH-*`, `SOT-*` — none matching `SPEC-*`. Two problems: (1) near-zero adoption of the SPEC-NNN
      convention; (2) the one match (`SPEC-CORRECTIONS-*`) may not even be a SPEC_TEMPLATE-shaped record, so
      clearing could make the oracle assert template sections against a non-conformant file. KEEP the flag
      and escalate a parity-SCOPE question: does the SPEC family mean "files named SPEC-*" or "all specs"?
      The specs/ dir is effectively an unmanaged freeform folder today.

  - family: VALIDATION
    template: templates/oversight/validation/VALIDATION_TEMPLATE.md
    frozen_glob: oversight/validation/VAL-*.md
    verdict: ZERO INSTANCES (pattern has no adoption anywhere)
    recommend: KEEP glob_unverified
    evidence: []
    notes: >-
      `VAL-*.md` matched 0 files in ALL four corpus projects. The primary validation/ dir uses freeform
      names: `bug-003-verification-2026-01-21.md`, `PUBLIC_RELEASE_VERIFICATION_2026-01-27.md`,
      `hook-validation-report-2026-01-20.md`, `skills-validation-report-2026-01-20.md`,
      `magic-moment-verification-2026-01-21.md`. Other projects' validation/ dirs are empty. The VAL-*
      identity convention has zero real adoption; real records are freeform `*validation*` / `*verification*`.
      KEEP the flag and escalate the naming/parity-scope mismatch (a corrected glob like
      `*validation*|*verification*` would be very loose and is a design call, not a mechanical fix).

