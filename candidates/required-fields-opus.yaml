# required-fields-opus.yaml
# PLAN-035 P2 Phase B, Lane B (required_fields presence-layer) — BLIND PAIR half (arch-rf-opus / Winston).
# Candidate ONLY. Does not touch the frozen registry, product files, or templates/.
#
# Scope (DEC-PM408-D1): the `required_fields` presence-kind captures leading-bold `**Key**:` IDENTITY
# metadata that BP-189's 3 original kinds (required_sections / required_frontmatter_keys / conventions)
# do not cover. A pin asserts the PRESENCE of the bold key LINE, never its value (CLAUDE.md §7).
#
# Authoring rule applied (stated once, applied uniformly):
#   PIN a field when it is a BARE, column-1, leading-bold `**Key**:` line that sits in the record's
#   IDENTITY HEADER (immediately after the H1/H2 title, before the first `##` section) AND that every
#   CONFORMANT INSTANCE must carry. Field NAMES are pinned; values are never pinned.
#   EXCLUDE (with reasons, see `excluded` block):
#     - table-cell metadata `| **Key** | value |`  (a different structural kind, not leading-bold `:`)
#     - list-prefixed `- **Key**:` instance fields on singleton checklists (per-use, not identity)
#     - register PER-ENTRY bold fields that only exist when the register is non-empty
#       (a legitimately-empty conformant register would false-fail a presence check)
#     - pure freshness/descriptive header lines (`**Purpose**`, `**Last Updated**`) already governed by
#       the `last_updated_present` convention or non-identity by nature.
# Line numbers below are traceability anchors into each template AS OF main@22d091a.

schema_version: 1
lane: B
author: arch-rf-opus

