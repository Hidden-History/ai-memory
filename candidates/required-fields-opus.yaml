    verdict: CONFIRM (pattern) + DEFECT (template false-match)
    recommend: ADD glob_exclude [SESSION_SNAPSHOT_TEMPLATE.md], THEN CLEAR glob_unverified
    evidence:
      - /mnt/e/projects/dev-ai-memory/oversight/session-logs/SESSION_SNAPSHOT_2026-01-30_1849.md
