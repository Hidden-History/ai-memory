# ============================================================================
# EXCLUDED — templates that CARRY bold-metadata but get NO required_fields pin.
# Recorded so the reviewer can see the discrimination that was applied (the brief's
# "distinguish genuinely-required identity fields from optional/example ones").
# ============================================================================
excluded_with_reason:

  - template: templates/oversight/tech-debt/TECH_DEBT_TEMPLATE.md
    reason: >-
      Identity metadata is a `| Field | Value |` TABLE (`| **ID** |`, `| **Severity** |`, `| **Status** |`,
      lines 5-11), not a leading-bold `**Key**:` line. Different structural kind — out of scope for
      required_fields (candidate for a future `required_table_fields` kind; see frictions).

  - template: templates/oversight/knowledge/best-practices/_TEMPLATE.md
    reason: >-
      Same as above — `## Metadata` is a `| Field | Value |` table (`| **BP-ID** |`, `| **Status** |`,
      `| **Confidence** |`). Table form, not leading-bold. Status/Confidence value-sets already governed
      by the registry `status_values` / `confidence_values` conventions.

  - template: templates/oversight/verification/checklists/code-review.md
    reason: >-
      `## Review Information` uses LIST-prefixed `- **Files/PR**: / - **Review Date**: / - **Reviewer**:`
      (7-11) describing a specific per-use review on a singleton checklist — instance data, not durable
      record identity. `**Verdict**` (105) is a summary field, not identity. Excluded.
