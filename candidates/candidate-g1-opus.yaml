    cap_kb: 15                           # [FR] + [FM] agree

- template: templates/oversight/tracking/dependencies.md
  produces: singleton
  target: oversight/tracking/dependencies.md
  class: register                        # INFERRED from role (BP-191 register) — template ships NO class front-matter (C5 gap)
  required_skeleton:
    required_sections:
      - "## External Dependencies"
      - "## Package Dependencies"
      - "## Internal Dependencies"
    # No front-matter → no required_frontmatter_keys.
  # No conventions: NOT in FALLBACK_REGISTRY and NO front-matter cap → no cap to assert;
  # no declared order/entry convention. Omitted per brief. FRICTION: register-class file
  # with no cap contract anywhere (candidate for a FALLBACK_REGISTRY/front-matter cap).
  consumed_by: []                        # C4 wiring unverified — out of G1 (C1/C6) scope

- template: templates/oversight/tracking/scope-change-log.md
  produces: singleton
  target: oversight/tracking/scope-change-log.md
  class: register                        # INFERRED from role (SC-### records, live=active) — template ships NO class front-matter (C5 gap)
  required_skeleton:
    required_sections:
      - "## Active Scope Changes"
      - "## Scope Change Details"
      - "## Rejected Changes"
    # '## Approved Changes (This Sprint)' left optional — the '(This Sprint)' qualifier is
    # instance-variable and would need a normalization rule.
  # No conventions: not in FALLBACK_REGISTRY, no front-matter cap → no verifiable rule.
  # FRICTION: register-class file with no cap contract anywhere.
  consumed_by: []                        # C4 wiring unverified — out of G1 (C1/C6) scope

- template: templates/oversight/session-index/INDEX.md
  produces: singleton
  target: oversight/session-index/INDEX.md
  class: live-index                      # template front-matter
  required_skeleton:
    required_sections:
      - "## Current Year"                # normalized prefix; template ships '## Current Year: [YYYY]'. §5 oracle-truth: absence ⇒ NON-conformant.
      - "## Archive"
    required_frontmatter_keys: [class, cap_lines, cap_kb]
  conventions:
    entry_pattern: '^\| '                # [FR] entry_pattern (table-row window)
    cap_lines: 120                       # [FR] + [FM] agree
    cap_kb: 10                           # [FR] + [FM] agree

- template: templates/oversight/session-index/WEEK_TEMPLATE.md
