# oversight-templates.yaml — PLAN-035 P2 Phase A, Group 1 (blind derivation: opus lane)
#
# Scope: the 17 Group-1 templates (convention / register / log / heartbeat / live-index
# classes + the record-family templates rooted in G1 subtrees). Derived independently
# from the version-locked templates in this worktree (templates/oversight/…).
#
# Fields per entry conform to PLAN-035 §3a:
#   template          — path of the shipped template (relative to repo root)
#   produces          — singleton (one instance/project) | family (glob of instances)
#   target | glob     — deployed singleton path, OR the glob that matches family instances
#   class             — BP-191 canonical class token (heartbeat|append-only-log|
#                       live-index|register|detail-record)
#   required_skeleton — C1: required_sections / required_frontmatter_keys the file MUST
#                       contain (open-world subset per BP-189: required ⊆ actual; extras
#                       and ALL values out of scope). Only load-bearing structure pinned.
#   conventions       — C6: machine-checkable rules only (entry_pattern, order, cap_lines,
#                       cap_kb). Omitted where the template declares no verifiable rule.
#   consumed_by       — C4 wiring. Populated ONLY where verified from tracking_rotate.py
#                       (FALLBACK_REGISTRY / FRESHNESS_OWNED). Full C4 wiring is OUT of the
#                       G1 (C1/C6) task scope — unverified consumers left [] with a note.
#
# Cap provenance key (every cap_lines/cap_kb cites its source):
#   [FR]  = class-contract FALLBACK_REGISTRY in
#           _ai-memory/pov/skills/aim-tracking-rotate/scripts/tracking_rotate.py
#   [FM]  = the template's own front-matter cap_lines/cap_kb
# All eight [FR] caps were cross-checked against the values the brief supplied — all match.
#
# Normalization: placeholder headings (e.g. '## Current Year: [YYYY]') are pinned as their
# stable prefix ('## Current Year') and matched prefix-normalized. See friction note in the
# completion report — the oracle needs an explicit placeholder-normalization rule (§3a:107).

- template: templates/oversight/project-status.md
  produces: singleton
  target: oversight/project-status.md
  class: heartbeat                       # template front-matter
  required_skeleton:
    # No H2 sections: the body is a single ```yaml routing block under the H1.
    required_frontmatter_keys: [class, cap_lines, cap_kb]
    # NON-STANDARD extension (flagged): the load-bearing content is the fenced routing
    # YAML in the body, which BP-189's three skeleton kinds (sections/frontmatter/json)
    # cannot express. Proposed 4th kind so this keystone routing file is not left loose.
    required_yaml_body_keys: [current_phase, active_task, phases_complete, key_files, live_record, open_issues]
  conventions:
    cap_lines: 60                        # [FR] + [FM] agree
    cap_kb: 6                            # [FR] + [FM] agree
  consumed_by:
    - aim-tracking-rotate                # FALLBACK_REGISTRY rel-path key (cap --check)
    - aim-tracking-freshness             # STATUS-divergence + tracking scan

- template: templates/oversight/SESSION_WORK_INDEX.md
  produces: singleton
  target: oversight/SESSION_WORK_INDEX.md
  class: live-index                      # template front-matter
  required_skeleton:
    # Exactly the four sections PM #407 hand-verified as the conformance set (§5 oracle-truth
    # test). The live SESSION_WORK_INDEX.md missing these MUST be flagged NON-conformant;
    # '## Last 5 Sessions' / '## Quick Links' left optional so the reported missing-set
    # matches the hand-verified result precisely.
    required_sections:
      - "## Current Sprint"
      - "## Active Task"
      - "## Active Blockers"
      - "## High Priority Risks"
    required_frontmatter_keys: [class, cap_lines, cap_kb]
  conventions:
    entry_pattern: '^\| '                # [FR] entry_pattern (table-row window)
    cap_lines: 80                        # [FR] + [FM] agree
    cap_kb: 12                           # [FR] + [FM] agree

- template: templates/oversight/tracking/task-tracker.md
  produces: singleton
  target: oversight/tracking/task-tracker.md
  class: register                        # template front-matter
  required_skeleton:
    required_sections:
      - "## Current Sprint"
      - "## Naming Convention"
    required_frontmatter_keys: [class, cap_lines, cap_kb]
  conventions:
    cap_lines: 60                        # [FR] + [FM] agree
    cap_kb: 4.5                          # [FR] + [FM] agree

- template: templates/oversight/tracking/blockers-log.md
  produces: singleton
  target: oversight/tracking/blockers-log.md
  class: register                        # template front-matter
  required_skeleton:
    required_sections:
      - "## Active Blockers"
      - "## Blocker Details"
      - "## Resolved Blockers"
    required_frontmatter_keys: [class, cap_lines, cap_kb]
  conventions:
    # Register: template declares no ordering; its entry boundary is mixed (Active/Resolved
    # TABLES + '### BLK-' detail H3s) — the exact reason it is in MANUAL_ROTATION_FILES.
    # No entry_pattern/order pinned (would be a guess). The cap is the verifiable rule.
    cap_lines: 100                       # [FR] + [FM] agree
    cap_kb: 15                           # [FR] + [FM] agree

- template: templates/oversight/tracking/risk-register.md
  produces: singleton
  target: oversight/tracking/risk-register.md
  class: register                        # template front-matter
  required_skeleton:
    required_sections:
      - "## Active Risks"
      - "## Resolved Risks"
    required_frontmatter_keys: [class, cap_lines, cap_kb]
  conventions:
    # Rows live under '### Critical/High/Medium/Low' severity H3s (not a linear log);
    # no order/entry_pattern pinned. Cap is the verifiable rule.
    cap_lines: 120                       # [FR] + [FM] agree
    cap_kb: 12                           # [FR] + [FM] agree

- template: templates/oversight/tracking/decision-log.md
  produces: singleton
  target: oversight/tracking/decision-log.md
  class: append-only-log                 # template front-matter
  required_skeleton:
    # Only the load-bearing container is pinned. '## How to Use' / '## Entry Format' are
    # instructional scaffolding a live log may trim (BP-189 §2.4 over-flag guard); '## Decisions'
    # is where entries live and MUST exist → guarantees the known-conformant file PASSES C1,
    # incl. after the C6 out-of-order test (moving an entry never removes the section).
    required_sections:
      - "## Decisions"
    required_frontmatter_keys: [class, cap_lines, cap_kb]
  conventions:
    entry_pattern: '^### DEC-[A-Z0-9-]+-D\d'   # front-matter "newest first" + brief-sanctioned pattern
    order: newest_first                        # template front-matter: "add new entries at the top, newest first"
    cap_lines: 150                       # [FR] + [FM] agree
    cap_kb: 50                           # [FR] + [FM] agree
  consumed_by:
    - aim-tracking-rotate                # FALLBACK_REGISTRY rel-path key
    - aim-tracking-freshness             # decision-log body-coverage scan

- template: templates/oversight/tracking/technical-debt.md
  produces: singleton
  target: oversight/tracking/technical-debt.md
  class: register                        # template front-matter
  required_skeleton:
    required_sections:
      - "## Debt Summary"
      - "## Active Technical Debt"
      - "## Debt by Category"
      - "## Resolved Debt"
    required_frontmatter_keys: [class, cap_lines, cap_kb]
