- template: templates/oversight/bugs/BUG_TEMPLATE.md
  produces: family
  glob: oversight/bugs/BUG-*.md
  class: detail-record                   # INFERRED: durable detail-record (BP-191 5a) — durable records ship NO class front-matter BY DESIGN
  required_skeleton:
    # Durable-core skeleton only; peripheral sections (Environment/Impact/Investigation/
    # Prevention/Metadata/Timeline/Notes) left optional so older bug records aren't
    # over-flagged (the 725-record family over-flag hazard, §3a).
    required_sections:
      - "## Summary"
      - "## Description"
      - "## Root Cause"
      - "## Resolution"
  consumed_by: []                        # C4 wiring unverified — out of G1 (C1/C6) scope

