  glob: oversight/session-index/*/week-*.md   # inferred from INDEX.md pointer '[YYYY-MM]/week-N.md' — FLAG (see report)
  class: detail-record                   # INFERRED: dated session artifact (BP-191 5b) — template ships NO class front-matter
  required_skeleton:
    required_sections:
      - "## Sessions"
  # No conventions: detail-record (per-file record; no cap, no linear order/entry rule).
  consumed_by: []                        # C4 wiring unverified — out of G1 (C1/C6) scope

