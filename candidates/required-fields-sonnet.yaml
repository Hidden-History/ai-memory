      Two templates (tech-debt/TECH_DEBT_TEMPLATE.md, knowledge/best-practices/_TEMPLATE.md)
      ship their identity metadata as a markdown TABLE (`| **Field** | Value |`) rather than
      leading-bold `**Key**:` lines — a third presence-layer shape that BP-189's 3 kinds plus
      the newly-sanctioned required_yaml_body_keys/required_fields (DEC-PM408-D1) still don't
      cover. Not fixed here (out of scope — dispatch asked specifically for leading-bold
      `**Key**:` metadata) but flagging since these two templates carry genuine identity data
      (ID/Severity/Status for TECH_DEBT; BP-ID/Status/Confidence for best-practices) that is
      currently un-pinned by any of the 4 sanctioned kinds. Severity: informational, in-scope
      for a future Phase (candidate: a 5th `required_table_fields` kind).
  - what: >
      3 of the 8 glob_unverified globs (AUDIT, FIX_SPEC, ROOT_CAUSE) are evidenced ONLY in
      sibling projects (document_pipeline / a single primary-repo instance), not in the primary
      dev-ai-memory oversight/ corpus itself — i.e. the SOURCE project that ships and pins these
      templates doesn't consistently follow its own shipped naming conventions for audits/fix-specs/
      root-cause docs. This is consistent with PLAN-035's overall finding that no project is
      template-conformant, but worth surfacing explicitly since it affects confidence in the
      "confirm" verdicts above (real-world usage exists, just not where you'd most expect it).
      Severity: informational, out of scope to fix here.
  - what: none beyond the above — no blockers, no tooling errors, no ambiguity that required
      guessing beyond the judgment calls already documented per-template above.
