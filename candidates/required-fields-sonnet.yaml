deliverable_2_glob_confirmations:
  # Corpora inspected: primary /mnt/e/projects/dev-ai-memory/oversight (richest), plus
  # /mnt/e/projects/dev-rag-stack/document_pipeline/oversight, /mnt/e/projects/dev-rag-stack/lsp_app/oversight,
  # /mnt/e/projects/ai-memory-testV2/oversight. Header shapes were spot-checked against the template
  # to confirm a filename match is a genuine template instance, not a coincidence.

  - template: templates/oversight/session-index/WEEK_TEMPLATE.md
    frozen_glob: oversight/session-index/*/week-*.md
    verdict: CONFIRM
    evidence:
      - oversight/session-index/2026-03/week-1.md (primary)
      - oversight/session-index/2026-03/week-2.md (primary)
    recommendation: clear glob_unverified — real matches found, glob is accurate.

  - template: templates/oversight/session-index/archive/QUARTER_ARCHIVE_TEMPLATE.md
    frozen_glob: oversight/session-index/archive/*-Q*.md
    verdict: CONFIRM
    evidence:
      - oversight/session-index/archive/2026-Q3.md (primary)
    recommendation: >
      clear glob_unverified. Note: archive/ also holds INDEX-ARCHIVE-2026-07-06_005416.md
      (an archived snapshot of INDEX.md, unrelated family) which does NOT match `*-Q*.md` —
      no conflict, no glob_exclude needed.

  - template: templates/oversight/bugs/ROOT_CAUSE_TEMPLATE.md
    frozen_glob: oversight/bugs/ROOT_CAUSE-*.md
    verdict: PROPOSE_CORRECTION
    evidence:
      - oversight/bugs/BUG-004-root-cause-analysis.md (primary) — the ONLY real root-cause
        record found across all four corpora; zero files named `ROOT_CAUSE-*.md` exist anywhere.
      - Its header (Investigation Date/Investigator/Bug Report Date/Severity/Status/Fixed By/
        Verified By) also does NOT match ROOT_CAUSE_TEMPLATE.md's own header shape (Bug ID/Date/
        Analyst/Status) — the real file predates or diverged from the template's current identity
        block, a separate content-drift finding beyond this glob task's scope.
    proposed_glob: oversight/bugs/BUG-*-root-cause*.md
    recommendation: >
      Correct the glob to `oversight/bugs/BUG-*-root-cause*.md` (matches the one real instance
      and the evident naming convention: root-cause docs are filed under the bug's own ID, not
      a separate ROOT_CAUSE-NNN ID space). Confidence is thin (n=1 real instance) — flag for
      team-lead/other-lane cross-check before clearing glob_unverified; if adopted, recommend
      keeping glob_unverified: true one more cycle pending a second real example, OR clear it
      with a note of the n=1 caveat.

  - template: templates/oversight/session-logs/SESSION_SNAPSHOT_TEMPLATE.md
    frozen_glob: oversight/session-logs/SESSION_SNAPSHOT_*.md
    verdict: CONFIRM
    evidence:
      - 12+ real matches in primary oversight/session-logs/, e.g. SESSION_SNAPSHOT_2026-01-30_1849.md,
        SESSION_SNAPSHOT_2026-02-11_PM24_BUG069_070_071.md, SESSION_SNAPSHOT_2026-02-16_PM50_LIVE_TESTING.md
    recommendation: clear glob_unverified — strongly evidenced, heaviest-used family template found.

  - template: templates/oversight/specs/FIX_SPEC_TEMPLATE.md
    frozen_glob: oversight/specs/FIX-*.md
    verdict: CONFIRM
    evidence:
      - oversight/specs/FIX-BUG-036-g1-full-gate-verdict.md (document_pipeline) — header matches
        FIX_SPEC_TEMPLATE's shape (Fix ID/Bug ID/Date/Status, plus extra Complexity/Author fields)
      - oversight/specs/FIX-SC4-CLASSIFY-SPAN.md, FIX-SC7-FLUSH-WORKER-PUSHGATEWAY.md (ai-memory-testV2)
        — filenames match, though header uses an ad-hoc Issue/Severity/Component/Estimated-Effort
        shape unrelated to FIX_SPEC_TEMPLATE (content drift, separate from the naming-glob question)
    recommendation: >
      clear glob_unverified — evidenced in 2 of 4 corpora. Note for team-lead: the primary
      project itself (dev-ai-memory) uses a THIRD naming style, `BUG-*-FIX-SPEC.md` (e.g.
      oversight/specs/BUG-245-FIX-SPEC.md), which does not match this glob — worth deciding
      whether to broaden the glob or treat it as pre-registry drift out of scope.

  - template: templates/oversight/specs/SPEC_TEMPLATE.md
    frozen_glob: oversight/specs/SPEC-*.md
    verdict: CONFIRM
    evidence:
      - oversight/specs/SPEC-CORRECTIONS-V207.md (primary; same file also present in ai-memory-testV2)
    recommendation: >
      clear glob_unverified — real match exists. Note: most files in oversight/specs/ use
      free-form Title-Case naming (Chunking-Strategy-V2.md, Core-Architecture-Principle-V2.md,
      etc.) rather than the SPEC-XXX ID convention — expected, since specs/ is a mixed directory
      and this template only governs the ID-prefixed subset.

  - template: templates/oversight/audits/AUDIT_TEMPLATE.md
    frozen_glob: oversight/audits/AUDIT-*.md
    verdict: CONFIRM
    evidence:
      - oversight/audits/AUDIT-001-master-checklist-meta-audit-docintel-lens.md (document_pipeline)
        — header matches AUDIT_TEMPLATE's shape exactly (ID=AUDIT-001, Date, Type, Status,
        Confidence)
      - oversight/audits/AUDIT-002-findings-critical-high.md, AUDIT-002-findings-medium-low.md,
        AUDIT-002-overview.md, AUDIT-003-phase-1-sample-doc-validation.md (document_pipeline)
    recommendation: >
      clear glob_unverified — evidenced (document_pipeline uses it consistently, 5 real files).
      Note: primary oversight (dev-ai-memory) and ai-memory-testV2 do NOT use this convention
      for their audits/ contents (free-form names like V2_COMPLIANCE_AUDIT_2026-01-17.md) —
      adoption is per-project, but the glob itself is real and should stay confirmed.

  - template: templates/oversight/validation/VALIDATION_TEMPLATE.md
    frozen_glob: oversight/validation/VAL-*.md
    verdict: ZERO_INSTANCES
    evidence:
      - Checked all four corpora's validation/ dirs — zero files anywhere named `VAL-*.md`.
        Every real file uses free-form descriptive naming instead (e.g.
        bug-003-verification-2026-01-21.md, hook-validation-report-2026-01-20.md,
        skills-validation-report-2026-01-20.md, PUBLIC_RELEASE_VERIFICATION_2026-01-27.md).
    recommendation: >
      keep glob_unverified: true. This is the one clean "zero instances anywhere" case among
      the 8 — the ID-based `VAL-NNN` convention appears aspirational, never adopted in practice.
      Recommend either (a) leaving the glob as documentation-only pending real adoption, or
      (b) revisiting whether the real free-form naming should be the recognized convention
      instead — out of scope for this task, flagging for team-lead.

friction_and_defects_noticed:
