# PLAN-035 P2 Phase B, Lane B — required_fields presence-layer candidate (BLIND, author: arch-rf-sonnet)
#
# Method: scanned templates/oversight/** for leading-bold `**Key**:` lines (grep -rlE
# '^\*\*[A-Za-z][A-Za-z0-9 /_-]*\*\*:'), then read each hit's full header to distinguish:
#   (a) the FIRST unconditional bold-key block after the title (before the first `---`/first
#       `##` section, or immediately under a section that has exactly ONE instance, e.g.
#       SESSION_WORK_INDEX's "## Current Sprint") = structural required_fields
#   (b) bold-key lines inside a "### <ID>-001: [Title]"-style WORKED EXAMPLE sub-entry (repeatable,
#       zero-or-many per file — e.g. tracking/technical-debt.md's "### TD-001" block,
#       knowledge/assumption-registry.md's "### A-001" block, AUDIT_TEMPLATE.md's "#### FINDING-1"
#       block, VALIDATION_TEMPLATE.md's per-test-case block) = NOT required (example content)
#   (c) static descriptive prose bold-labels ("**Purpose**:", "**Format**:", "**Authority for
#       status**:") whose text is fixed boilerplate copied verbatim from the template, not a
#       per-instance-varying value = NOT pinned (excluded as noise per CLAUDE §2 Simplicity First;
#       distinguished from (a) by whether the field's VALUE is expected to vary per real instance)
#
# 31 templates matched the raw grep; 5 were excluded entirely after reading (see excluded_from_scope):
# tech-debt/TECH_DEBT_TEMPLATE.md and knowledge/best-practices/_TEMPLATE.md use a `| **Key** | Value |`
# TABLE format, not leading-bold `**Key**:` lines — a distinct, not-yet-sanctioned presence-layer kind,
# out of scope for this deliverable. The other grep hits (verification/checklists/*, tracking/dependencies
# non-header rows, etc.) were confirmed as example/prose-only, not header blocks.
#
# Two confidence tiers reported (26 templates total, vs. the ~15 estimate in the dispatch — see notes):
#   tier: identity-block   — rich multi-field record header (ID/Date/Status/Severity/Type/Confidence-like).
#                             Directly matches the task's own framing. HIGH confidence.
#   tier: freshness-marker — singleton register/live-index carrying only a "Last Updated"/"Updated"
#                             (+ SESSION_WORK_INDEX's Current-Sprint block) header field. Still a
#                             genuine leading-bold key, unconditionally present, per-instance-varying
#                             value (a date) — but thinner/less "identity"-like than tier 1.
#                             MEDIUM confidence; recommend team-lead decide whether to fold into the
#                             registry or trim, since the ~15 estimate may have meant tier 1 only.

