# candidate-g2-sonnet.yaml
# PLAN-035 P2 Phase A — Group 2 blind-derivation candidate (derive-g2-sonnet)
# Scope: 23 G2 templates under templates/oversight/ — required_skeleton (C1) + conventions (C6).
# Schema: PLAN-035 §3a (oversight-templates.yaml) + BP-189 (subset semantic, required_skeleton ⊆ actual).
# Derived from templates/oversight/ in worktree ai-memory-p2-g2-sonnet ONLY — never from any user's tree.
# Independently derived; no peer candidate file was read (blind-derivation protocol).
#
# ADJUDICATED OMISSION (team-lead ruling, this session): the brief originally listed a 24th item,
# `.audit/logs/sanitization-log.jsonl`. Verified NOT git-tracked at `main` (zero commits ever,
# gitignored by `.gitignore:16` `logs/`) — untracked maintainer-local runtime debris, not a shipped
# template. Team-lead independently confirmed and ruled: OMIT entirely (registry declares only what
# ships, derived strictly from git-tracked templates/oversight/). Dropped from this candidate — not
# present as an entry, not even as a NEEDS-ADJUDICATION placeholder. G2 set is 23 templates.
#
# GLOBAL NORMALIZATION RULES (apply to every required_sections entry below unless noted):
#   1. Numbered heading prefixes ("## 1. Goal") are stripped to the topic text ("Goal") before
#      comparison — section numbering is presentational, not semantic; a legitimately renumbered
#      or reordered doc must not fail C1 on that basis alone.
#   2. Headings explicitly suffixed "(if applicable)" / "(if new code was added)" /
#      "(if agents were dispatched)" in the TEMPLATE's own text are treated as CONDITIONAL, not
#      required — the template itself declares them optional-by-condition.
#   3. "[Repeat structure]" / "[Repeat structure as above]" duplicate patterns (Alternative 2,
#      Option 3, Finding 2..5, Test Case 2, Component 2) are illustrative repetition of an already-
#      required parent section — only the first instance's PARENT heading is required, not the
#      numbered repeats.
#   4. Bracketed year-range placeholders in headings (e.g. "Current Best Practice (2024-2026)") are
#      normalized by dropping the year-range suffix — the year range goes stale on a fixed schedule
#      and is not part of the section's identity.
#   5. required_sections values are the literal heading text AFTER rules 1/4 normalization,
#      set-containment (open-world), never order- or case-sensitive unless stated.
#
# KNOWN SCHEMA GAP (flagged, not resolved here): ~15 of these 24 templates carry their identity/
# status metadata as bold "**Key**: value" lines under the H1 (not a `---` YAML frontmatter block,
# not a markdown table with parseable rows in all cases) — e.g. FIX_SPEC/SPEC/AUDIT/VALIDATION/
# DECISION/CONSTRAINT template headers. BP-189's three skeleton kinds (required_sections /
# required_frontmatter_keys / required_json_keys) do not cover this "bold key:value block" shape.
# These fields are NOT pinned below. See report to team-lead for detail — possible BP-189 §2.2
# fourth kind (`required_bold_keys`) candidate for a future revision.

