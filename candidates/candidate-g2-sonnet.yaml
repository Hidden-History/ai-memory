- template: templates/oversight/PROJECT_STANDARDS.yaml
  produces: singleton
  target: "PROJECT_STANDARDS.yaml"
  class: detail-record
  notes: >
    NON-MARKDOWN MEMBER — flagged per task instructions. Pure YAML, no markdown headings, so
    required_sections is inapplicable. Modeled as required_yaml_keys (top-level key presence,
    JSON-pointer-style paths) — a natural extension of BP-189's required_json_keys kind to a YAML
    (non-JSON) file, since the presence-only / open-world semantic is identical. This is not one of
    BP-189's three named kinds; flagging as a modeling question for adjudication alongside the
    required_bold_keys gap noted at file top.
    VERIFIED TEMPLATE DEFECT (not a modeling choice — confirmed by parsing): the template has TWO
    top-level YAML keys both named `project` (line 5: `project: "[PROJECT_NAME]"` scalar identity
    field; line 21: `project:` — a second, distinct `project:` key for the project-specific-standards
    list). Parsed with `yaml.safe_load`, the second occurrence silently clobbers the first — the
    project-name identity field is destroyed; `project` resolves to `None`. Confirmed live:
    `python3 -c "import yaml; print(yaml.safe_load(open('templates/oversight/PROJECT_STANDARDS.yaml')))"`
    → `{'schema_version': '1.0', 'project': None, 'last_updated': '...', 'global': None,
    'topic_index': None}`. `project` is EXCLUDED from required_yaml_keys below because the key itself
    is broken in the shipped template — pinning it as required would assert a lie. This is a real,
    reproducible bug in the shipped template, reported here per CLAUDE.md §6; recommend team-lead
    file a TD (rename one of the two `project:` keys, e.g. `project_name` vs `project_standards`).
  required_skeleton:
    required_yaml_keys:
      - "/schema_version"
      - "/last_updated"
      - "/global"
      - "/topic_index"
  consumed_by:
    - _ai-memory/_memory/parzival-sidecar/oversight-schema.yaml   # directory-level ("root:") only
