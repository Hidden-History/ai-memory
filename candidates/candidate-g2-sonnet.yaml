    frontmatter). Glob is inferred from the template's own plan_id pattern, not validated against a
    live specimen — flagged in report.
  required_skeleton:
    required_frontmatter_keys:
      - plan_id
      - plan_role
      - type
      - status
      - previous_plan
      - previous_completed
      - approved_by
      - approved_date
      - pattern_of_record
      - canonical_order_source
