# Oversight Directory Schema
# Defines the expected structure of the {oversight_path}/ directory
# Parzival session workflows read from and write to this structure

directories:
  root:
    - SESSION_WORK_INDEX.md       # Quick context loading (~400 tokens)
    - PROJECT_STANDARDS.yaml      # Project-level standards

  tracking:
    description: Sprint and project tracking files
    files:
      - task-tracker.md
      - risk-register.md
      - blockers-log.md
      - dependencies.md
      - scope-change-log.md
      - technical-debt.md

  decisions:
    description: Decision records (DEC-### format)
    pattern: "DEC-{number}.md"

  bugs:
    description: Bug reports (BUG-### format)
    pattern: "BUG-{number}.md"

  session-logs:
    description: Session handoff documents
    pattern: "SESSION_HANDOFF_{date}.md"

  session-index:
    description: Archived session history
    files:
      - INDEX.md

  reports:
    description: Test, audit, and review reports

  specs:
    description: Fix and feature specifications

  plans:
    description: Implementation plans

  knowledge:
    description: Confidence maps and assumptions

  learning:
    description: Failure patterns and lessons learned

  research:
    description: Best practices research

  agent-constraints:
    description: Per-agent constraint overrides

  audits:
    description: Audit records

  standards:
    description: Global and project standards

  validation:
    description: Validation records

  verification:
    description: Verification checklists and results
    subdirectories:
      checklists:
        description: Verification checklist templates

# Consumers of the oversight files above.
#
# A "consumer" is a shipped POV skill/workflow that programmatically reads or
# rewrites an oversight file's structure or lifecycle (e.g. caps/rotates it,
# scans it, regenerates an index from it) -- NOT a skill that merely displays a
# file's text for context. This block is the single vocabulary of valid
# consumer identifiers.
#
# One source of truth, no parallel system (DEC-PM406-D3): the consumer NODES
# live here; the per-file consumer EDGES live in the template-parity registry
# (oversight-templates.yaml) as `consumed_by:` lists. The C4 wiring gate
# (PLAN-035 §3a) requires every `consumed_by:` value to name a key in this
# block -- a value that does not resolve here fails CI.
consumers:
  aim-tracking-rotate:
    kind: skill
    path: pov/skills/aim-tracking-rotate
    reads: Caps and rotates lifecycle-managed oversight files by class contract.
  aim-tracking-freshness:
    kind: skill
    path: pov/skills/aim-tracking-freshness
    reads: Scans registers, regenerates INDEX views, checks decision-log coverage.
